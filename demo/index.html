  <body>
    <main id="demo">
      <noscript>
        <h1>Valve</h1>
        <p>
          An FFGL effect that runs the picture through a valve amplifier the way
          a guitar goes through an overdriven amp. Every stage is a specific
          valve (Norman Koren's model of a 12AX7, 12AT7, 12AU7 or 6DJ8 preamp
          triode, or an EL34, 6L6GC, KT88 or 300B power valve), solved on the
          load line of the circuit it sits in and chained like an amp: up to
          four preamp stages, then one power valve or a push-pull pair. None of
          it is a drawn curve, so the overdrive comes out of the maths: a soft
          fade into cutoff against a hard knee where the grid conducts, the
          12AU7 that stays clean where a 12AX7 crunches, and a push-pull pair's
          crossover step when it's biased cold. Feed it as RGB, as Y/C with the
          chroma on a subcarrier so the hue survives, or as Composite.
        </p>
        <p>
          This demo runs the plugin's shaders and a port of its CPU half in your
          browser, so it needs JavaScript and WebGL2. The plugin itself, its
          source and its downloads are on
          <a href="https://github.com/stoatworks-labs/valve">its repository</a>.
        </p>
